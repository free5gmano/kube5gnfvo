# File: upf.yaml
tosca_definitions_version: tosca_simple_yaml_1_0

topology_template:
  node_templates:
    VNF1:
      type: tosca.nodes.nfv.VNF
      properties:
        descriptor_id: 5324171d-a6bd-48ac-894d-0a7ad87f0fd1-upf
        descriptor_version: 1.0
        provider: imac
        product_name: upf
        software_version: latest

    VDU1:
      type: tosca.nodes.nfv.Vdu.Compute
      properties:
        sw_image_data:
          name: free5gc-user-plane
          provider: free5gmano
          version: stage3.2.1-amd64
          diskFormat: raw
      capabilities:
        virtual_compute:
          properties:
            virtual_memory:
              virtual_mem_size: 512Mi
            virtual_cpu:
              num_virtual_cpu: 250m
      artifacts:
        sw_image:
          type: tosca.artifacts.nfv.SwImage
          file: free5gmano/free5gc-user-plane:stage4.0.0-amd64
        upf:
          type: tosca.artifacts.File
          file: Files/Artifacts/upfcfg.conf
          deploy_path: /free5gc/config/upfcfg.yaml
      attributes:
        namespace: default
        name_of_service: upf-5324171d-svc
        ports: [8805, 29518, 2152]
        protocol: [UDP, TCP, UDP]
#        name_of_nodeport: upf-5324171d-svc
#        nodeport: [8805, 29518, 2152]
#        nodeport_protocol: [UDP, TCP, UDP]
#        targetport: [8805, 29518, 2152]
        stateful_application: 0
        replicas: 1
        command: [bash, -c, sleep 10s && /setup-uptun.sh eth0 && ./bin/upf]
        tun: /dev/net/tun

    CP1:
      type: tosca.nodes.nfv.Cpd
      properties:
        layer_protocol: ipv4
      requirements:
        virtual_binding: VDU1
        virtual_link: VL1

    VL1:
      type: tosca.nodes.nfv.VnfVirtualLink
      properties:
        network_name: management
        vl_profile:
          virtual_link_protocol_data:
            l3_protocol_data:
              dhcp_enabled: False
