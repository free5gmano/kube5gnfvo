# File: webui.yaml
tosca_definitions_version: tosca_simple_yaml_1_0

topology_template:
  node_templates:
    VNF1:
      type: tosca.nodes.nfv.VNF
      properties:
        descriptor_id: 330436be-477d-4c0b-b316-5a08e6ba92ac-webui
        descriptor_version: 1.0
        provider: imac
        product_name: webui
        software_version: latest

    VDU1:
      type: tosca.nodes.nfv.Vdu.Compute
      properties:
        sw_image_data:
          name: free5gc-control-plane
          provider: free5gmano
          version: stage4.0.0-amd64
          diskFormat: raw
      capabilities:
        virtual_compute:
          properties:
            virtual_memory:
              virtual_mem_size: 2Gi
            virtual_cpu:
              num_virtual_cpu: 2000m
      artifacts:
        sw_image:
          type: tosca.artifacts.nfv.SwImage
          file: free5gmano/free5gc-webui:stage4.0.0-amd64
        upf:
          type: tosca.artifacts.File
          file: Files/Artifacts/webuicfg.conf
          deploy_path: /free5gc/config/webuicfg.yaml
      attributes:
        namespace: default
        name_of_nodeport: webui-330436be-svc
        nodeport: [31111]
        nodeport_protocol: [TCP]
        targetport: [5000]
        stateful_application: 0
        replicas: 1
        command: ["/bin/bash", "-c", "go run server.go -c /free5gc/config/webuicfg.yaml"]

    CP1:
      type: tosca.nodes.nfv.Cpd
      properties:
        layer_protocol: ipv4
      requirements:
        virtual_binding: VDU1
        virtual_link: VL1

    VL1:
      type: tosca.nodes.nfv.VnfVirtualLink
      properties:
        network_name: management
        vl_profile:
          virtual_link_protocol_data:
            l3_protocol_data:
              dhcp_enabled: False
